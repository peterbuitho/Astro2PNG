# Builds the astro2png CLI and astro2png-gui desktop app natively on
# Windows, Linux (x86-64 + ARM64) and macOS, and attaches the archives to a
# GitHub Release. Both now link astropng-core
# (github.com/peterbuitho/astropng-core, pinned in
# third_party/astropng-core/VERSION) as a native static library, which is
# why this builds natively per target instead of cross-compiling the CLI
# from one runner as before (Zig's own cross-compiler has nothing to cross-
# compile astropng-core's Rust build for).
#
# Push a tag like `v0.1.0`, or run the workflow manually from the Actions tab
# to check that all targets still build (archives are uploaded as workflow
# artifacts; no release is made).

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      value: ${{ steps.ver.outputs.value }}
    steps:
      - id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0-dev+${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: ${{ matrix.name }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x86_64, os: windows-latest }
          - { name: linux-x86_64, os: ubuntu-24.04 }
          - { name: linux-aarch64, os: ubuntu-24.04-arm }
          - { name: macos-universal, os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: dtolnay/rust-toolchain@stable

      - name: Linux GUI build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxext-dev libwayland-dev libxkbcommon-dev libgl1-mesa-dev

      - name: Build astropng-core
        shell: bash
        run: bash scripts/build-core.sh

      - name: Build CLI
        run: zig build -Doptimize=ReleaseFast -Dversion=${{ needs.version.outputs.value }} --summary all

      - name: Build GUI
        run: zig build -Dgui -Doptimize=ReleaseFast -Dversion=${{ needs.version.outputs.value }} --summary all

      - name: Package CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          bin="zig-out/bin/astro2png"; [[ -f "$bin.exe" ]] && bin="$bin.exe"
          cp README.md "$(dirname "$bin")/"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            (cd "$(dirname "$bin")" && 7z a "$GITHUB_WORKSPACE/dist/astro2png-cli-${{ matrix.name }}.zip" "$(basename "$bin")" README.md)
          else
            tar -czf "dist/astro2png-cli-${{ matrix.name }}.tar.gz" -C "$(dirname "$bin")" "$(basename "$bin")" README.md
          fi

      - name: Package GUI (Windows / Linux)
        if: runner.os != 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            7z a "dist/astro2png-gui-${{ matrix.name }}.zip" ./zig-out/bin/astro2png-gui.exe README.md
          else
            tar -czf "dist/astro2png-gui-${{ matrix.name }}.tar.gz" -C zig-out/bin astro2png-gui -C "$GITHUB_WORKSPACE" README.md
          fi

      - name: Package GUI (macOS .app)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          mkdir -p dist
          app="dist/astro2png.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp zig-out/bin/astro2png-gui "$app/Contents/MacOS/astro2png-gui"

          iconset="$(mktemp -d)/astro2png.iconset"; mkdir -p "$iconset"
          for s in 16 32 128 256 512; do
            sips -z $s $s assets/icon.png --out "$iconset/icon_${s}x${s}.png" >/dev/null
            sips -z $((s*2)) $((s*2)) assets/icon.png --out "$iconset/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/astro2png.icns"

          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>astro2png</string>
            <key>CFBundleIdentifier</key><string>io.github.peterbuitho.astro2png</string>
            <key>CFBundleVersion</key><string>${{ needs.version.outputs.value }}</string>
            <key>CFBundleShortVersionString</key><string>${{ needs.version.outputs.value }}</string>
            <key>CFBundleExecutable</key><string>astro2png-gui</string>
            <key>CFBundleIconFile</key><string>astro2png</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          EOF

          codesign --force --deep --sign - "$app" || true
          cp README.md dist/
          (cd dist && zip -r -y "astro2png-gui-macos-universal.zip" astro2png.app README.md)
          rm -rf dist/astro2png.app dist/README.md

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
