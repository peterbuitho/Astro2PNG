# Builds the astro2png CLI (all six targets, cross-compiled from one Linux
# runner) and the astro2png-gui desktop app (native per-OS matrix, because it
# links SDL3) and attaches the archives to a GitHub Release.
#
# Push a tag like `v0.1.0`, or run the workflow manually from the Actions tab
# to check that all targets still build (archives are uploaded as workflow
# artifacts; no release is made).

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      value: ${{ steps.ver.outputs.value }}
    steps:
      - id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0-dev+${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          fi

  cli:
    name: CLI — cross-compile all targets
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig build release -Dversion=${{ needs.version.outputs.value }} --summary all
      - name: Package CLI archives
        run: |
          set -euo pipefail
          mkdir -p dist
          declare -A NAMES=(
            [x86_64-windows]=windows-x86_64
            [aarch64-windows]=windows-aarch64
            [x86_64-linux-musl]=linux-x86_64
            [aarch64-linux-musl]=linux-aarch64
            [x86_64-macos]=macos-x86_64
            [aarch64-macos]=macos-aarch64
          )
          for triple in "${!NAMES[@]}"; do
            name="${NAMES[$triple]}"; src="zig-out/release/$triple"
            [[ -f "$src/astro2png" ]] && bin="astro2png" || bin="astro2png.exe"
            cp README.md "$src/"
            if [[ "$triple" == *windows* ]]; then
              (cd "$src" && zip -q "$GITHUB_WORKSPACE/dist/astro2png-cli-$name.zip" "$bin" README.md)
            else
              tar -czf "dist/astro2png-cli-$name.tar.gz" -C "$src" "$bin" README.md
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: cli
          path: dist/*
          if-no-files-found: error

  gui:
    name: GUI — ${{ matrix.name }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x86_64, os: windows-latest }
          - { name: linux-x86_64, os: ubuntu-24.04 }
          - { name: macos-universal, os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Linux GUI build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxext-dev libwayland-dev libxkbcommon-dev libgl1-mesa-dev

      - name: Build GUI
        shell: bash
        run: zig build -Dgui -Doptimize=ReleaseFast -Dversion=${{ needs.version.outputs.value }} --summary all

      - name: Package (Windows / Linux)
        if: runner.os != 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            7z a "dist/astro2png-gui-${{ matrix.name }}.zip" ./zig-out/bin/astro2png-gui.exe README.md
          else
            tar -czf "dist/astro2png-gui-${{ matrix.name }}.tar.gz" -C zig-out/bin astro2png-gui -C "$GITHUB_WORKSPACE" README.md
          fi

      - name: Package (macOS .app)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          mkdir -p dist
          app="dist/astro2png.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp zig-out/bin/astro2png-gui "$app/Contents/MacOS/astro2png-gui"

          iconset="$(mktemp -d)/astro2png.iconset"; mkdir -p "$iconset"
          for s in 16 32 128 256 512; do
            sips -z $s $s assets/icon.png --out "$iconset/icon_${s}x${s}.png" >/dev/null
            sips -z $((s*2)) $((s*2)) assets/icon.png --out "$iconset/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/astro2png.icns"

          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>astro2png</string>
            <key>CFBundleIdentifier</key><string>io.github.peterbuitho.astro2png</string>
            <key>CFBundleVersion</key><string>${{ needs.version.outputs.value }}</string>
            <key>CFBundleShortVersionString</key><string>${{ needs.version.outputs.value }}</string>
            <key>CFBundleExecutable</key><string>astro2png-gui</string>
            <key>CFBundleIconFile</key><string>astro2png</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          EOF

          codesign --force --deep --sign - "$app" || true
          cp README.md dist/
          (cd dist && zip -r -y "astro2png-gui-macos-universal.zip" astro2png.app README.md)
          rm -rf dist/astro2png.app dist/README.md

      - uses: actions/upload-artifact@v4
        with:
          name: gui-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [cli, gui]
    # Publish as long as the CLI built; a failing GUI matrix leg (e.g. a new
    # macOS SDK quirk) still leaves a useful release.
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') && needs.cli.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
